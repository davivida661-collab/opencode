name: build-lume

on:
  push:
    tags:
      - "lume-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: lume-linux-x64
          - os: macos-latest
            artifact: lume-macos-arm64
          - os: windows-latest
            artifact: lume-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Compile binary
        working-directory: lume
        shell: bash
        run: bun build src/index.ts --compile --outfile ${{ matrix.artifact }}
      - name: Smoke check
        working-directory: lume
        shell: bash
        run: ./${{ matrix.artifact }} --version
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: lume/${{ matrix.artifact }}
